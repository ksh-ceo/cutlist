<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<title>MONTAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
<style>
:root{--s1:8px;--s2:24px;--s3:clamp(64px,12vw,96px);--bg:#0a0908;--sf:#17140f;--ln:rgba(255,255,255,.16);--tx:#f3ece1;--mu:#a29a8d;--rd:#ff6a5c;--cta:#e5392c;--cy:#ffb454;--gl:rgba(255,180,84,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4eee3;--sf:#fffaf0;--ln:rgba(0,0,0,.18);--tx:#1d1812;--mu:#5f5547;--rd:#c8321f;--cy:#9a5a0a;--gl:rgba(255,160,60,.22);color-scheme:light}}
:root[data-theme="light"]{--bg:#f4eee3;--sf:#fffaf0;--ln:rgba(0,0,0,.18);--tx:#1d1812;--mu:#5f5547;--rd:#c8321f;--cy:#9a5a0a;--gl:rgba(255,160,60,.22);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Manrope,-apple-system,"Segoe UI",sans-serif;overflow-wrap:break-word}
main{max-width:640px;margin:0 auto;padding:var(--s2) var(--s2) 150px}
.m,.lab,.big,.btn,.chip,.mu2,#nav button{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.rec{display:flex;align-items:center;gap:var(--s1);font-weight:700;letter-spacing:.14em;font-size:13px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--rd);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
.tc{font-size:20px;color:var(--mu)}
.sec{margin-bottom:var(--s3)}.sec>*+*{margin-top:var(--s2)}
.cl{margin-bottom:var(--s2);flex-direction:column;align-items:flex-start;gap:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.lab{font-size:12px;letter-spacing:.14em;color:var(--mu);font-weight:500;text-transform:uppercase}
.dream{font:italic 800 clamp(26px,7vw,38px)/1.15 "Playfair Display",Georgia,serif;margin:0;cursor:pointer}
.why{font:italic 400 18px/1.5 "Playfair Display",Georgia,serif;color:var(--mu);margin:0;cursor:pointer}
.big{font-weight:700;font-size:clamp(52px,16vw,88px);line-height:1;letter-spacing:-.02em;text-shadow:0 0 36px var(--gl)}
.big.sm{font-size:clamp(36px,10vw,52px)}.big small{font-size:18px;color:var(--mu);font-weight:500}
.live .big{color:var(--rd)}.live .lab span:last-child{color:var(--rd)}
.mu2{font-size:13px;color:var(--mu);line-height:1.5;margin:0}
p{margin:0}
.bar{height:6px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy);width:0}
.btn{min-height:52px;padding:0 var(--s2);border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{border-color:var(--cy)}.btn:disabled{opacity:.6;cursor:wait}
.btn.p{background:var(--cta);border-color:var(--cta);color:#fff}
.go{width:100%;min-height:60px;font-size:15px;position:sticky;bottom:calc(56px + var(--s1) + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lnk{min-height:44px;padding:0;background:none;border:0;color:var(--mu);text-decoration:underline;text-underline-offset:4px;font:600 14px Manrope,sans-serif;cursor:pointer;text-align:left}
.lnk:hover{color:var(--cy)}
.links{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:var(--s2)}
.tight>*+*{margin-top:var(--s1)}
.card+.card{margin-top:var(--s2)}
.nm{font-size:18px}.nm a{color:inherit}
.chips{display:flex;gap:var(--s1);flex-wrap:wrap}
.chip{font-size:11px;letter-spacing:.06em;border:1px solid var(--ln);border-radius:20px;padding:2px var(--s1);color:var(--mu)}
.chip.r{border-color:var(--rd);color:var(--rd)}.chip.c{border-color:var(--cy);color:var(--cy)}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2);padding:var(--s1) 0;min-height:56px;border-top:1px solid var(--ln)}
.li .g{flex:1 1 200px;min-width:0}.li.dn .g{text-decoration:line-through;color:var(--mu)}
.empty>*+*{margin-top:var(--s2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
.d{height:56px;border:1px solid var(--ln);border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:4px}
.d i{display:block;height:8px;background:var(--cy);border-radius:2px}
.d em{position:absolute;top:4px;left:4px;font:500 10px "JetBrains Mono",monospace;color:var(--mu);font-style:normal}
.d.t{border-color:var(--rd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.stats b{display:block;font:700 28px "JetBrains Mono",monospace}.stats span{font-size:13px;color:var(--mu)}
.hist{display:flex;gap:var(--s1);align-items:flex-end;height:40px}.hist div{flex:1;background:var(--ln);border-radius:3px;position:relative;height:100%}.hist i{position:absolute;left:0;right:0;bottom:0;background:var(--cy);border-radius:3px}
.quote{border-left:2px solid var(--cy);padding-left:var(--s2);font:italic 400 20px/1.5 "Playfair Display",Georgia,serif}
.lvl{color:var(--cy);font-weight:600;font-size:15px}
.chk,.add{display:flex;gap:var(--s2);align-items:center}.add input{flex:1}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
label{display:block;margin-bottom:var(--s1);font-size:14px;color:var(--mu)}
input,select{font:inherit;font-size:17px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:0 var(--s1);min-height:52px;width:100%}
select option{background:var(--sf);color:var(--tx)}
input[type=checkbox]{width:26px;min-height:26px;height:26px;accent-color:var(--cy);flex:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#banner{display:none;border-left:3px solid var(--rd);padding-left:var(--s2);margin-bottom:var(--s2);color:var(--rd);font-weight:600}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;max-width:144px;margin:0 auto;min-height:56px;background:none;border:0;color:var(--mu);font-weight:700;font-size:11px;letter-spacing:.08em;cursor:pointer;box-shadow:inset 0 2px 0 transparent}
#nav button.on{color:var(--rd);box-shadow:inset 0 2px 0 var(--rd)}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:20px;width:min(92vw,440px);padding:var(--s2);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 var(--s1);font-size:22px}
dialog label{margin-top:var(--s2)}
#derr{color:var(--rd);font-size:14px;min-height:24px;margin-top:var(--s2)}
.acts{display:flex;flex-direction:column-reverse;align-items:stretch;gap:var(--s1);margin-top:var(--s1)}.acts .lnk{text-align:center;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s2) + 72px + env(safe-area-inset-bottom,0px));background:var(--sf);border:1px solid var(--cy);border-radius:12px;padding:var(--s1) var(--s2);z-index:20;display:none;align-items:center;gap:var(--s2);width:min(92vw,560px);font-size:15px}
#toast.on{display:flex}#toast button{background:none;border:0;color:var(--cy);font:700 14px Manrope,sans-serif;min-height:44px;cursor:pointer;text-decoration:underline}
@media(max-width:380px){.calc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#rf{font-size:22px;min-width:44px;text-decoration:none;text-align:center}
body{min-height:calc(100vh + 2px)}
@supports (min-height:100dvh){body{min-height:calc(100dvh + 2px)}}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--s1);background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:16px;font:700 15px Manrope,sans-serif;letter-spacing:0;text-align:center;transition:transform .12s,border-color .2s,box-shadow .2s}
.btn:active{transform:scale(.985)}
.btn .tx{display:flex;flex-direction:column;gap:2px;flex:1;text-align:left}
.btn .tx b{font:800 16px/1.25 Manrope,sans-serif}
.btn .tx small{font:500 12px/1.35 Manrope,sans-serif;color:var(--mu)}
.btn .ar{font-size:22px;opacity:.6;flex:none;line-height:1;margin-left:var(--s1)}
.btn .ic{margin-right:var(--s1);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.btn .ic svg{width:18px;height:18px}
.btn.p{background:linear-gradient(135deg,#ff6b45 0%,#e5392c 55%,#c92a46 100%);border:0;color:#fff;min-height:68px;padding:var(--s1) var(--s2);box-shadow:0 8px 22px rgba(229,57,44,.32),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.p .tx small{color:rgba(255,255,255,.82)}
.btn.p .ar{opacity:.85}
.btn.p:hover{filter:brightness(1.08)}
.go{min-height:76px;border-radius:20px}
.go .ic{width:48px;height:48px}.go .ic svg{width:22px;height:22px}
.go .tx b{font-size:18px}
.row.cl{flex-direction:column;align-items:flex-start;gap:0}
.card .btn{width:100%}

html{background:var(--bg)}
#glow{position:fixed;inset:0;pointer-events:none;z-index:40;mix-blend-mode:screen;-webkit-transform:translateZ(0);transform:translateZ(0)}
#glow::before,#glow::after{content:"";position:absolute;inset:0;transition:opacity .9s ease}
#glow::before{background:radial-gradient(120% 52% at 50% -14%,rgba(255,184,92,.34),rgba(255,140,60,.11) 46%,transparent 74%),radial-gradient(55% 26% at 92% 2%,rgba(255,92,70,.16),transparent 72%)}
#glow::after{opacity:0;background:radial-gradient(120% 52% at 50% -14%,rgba(255,74,61,.40),rgba(255,74,61,.12) 46%,transparent 74%),radial-gradient(80% 30% at 20% 104%,rgba(255,74,61,.20),transparent 70%)}
#glow.rec::before{opacity:0}#glow.rec::after{opacity:1}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #glow{mix-blend-mode:normal;opacity:.5}}
:root[data-theme="light"] #glow{mix-blend-mode:normal;opacity:.5}
/* свечение в деталях */
#nav button.on{background:radial-gradient(70% 95% at 50% 0%,rgba(255,106,92,.22),transparent 76%);box-shadow:inset 0 2px 0 var(--rd),0 -6px 20px -8px rgba(255,74,61,.65)}
.bar i{box-shadow:0 0 14px var(--cy)}
.d.t{box-shadow:0 0 16px -4px var(--rd)}
.chip.c{box-shadow:0 0 12px -3px var(--cy)}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px -18px rgba(0,0,0,.8)}
.live .big{text-shadow:0 0 32px rgba(255,74,61,.55)}
/* статистика: все три цифры на одном уровне */
.sec.stats>*+*{margin-top:0}
.stats{align-items:start}
.hist{height:44px;margin-bottom:var(--s2)}
.hist div{background:rgba(255,255,255,.06);border-radius:6px}
.hist div i{border-radius:6px;box-shadow:0 0 10px -2px var(--cy)}
.hist div u{position:absolute;top:100%;left:0;right:0;margin-top:4px;text-align:center;text-decoration:none;font:500 10px "JetBrains Mono",monospace;color:var(--mu)}
.hist div.t u{color:var(--rd);font-weight:700}

#gear{font-size:22px;min-width:44px;text-decoration:none;text-align:center}
.dream.sm{font-size:clamp(22px,6vw,30px)}
.pills{display:flex;gap:var(--s1);flex-wrap:wrap;align-items:center}
.pill{font:600 12px Manrope,sans-serif;border:1px solid var(--ln);border-radius:20px;padding:4px var(--s1);color:var(--mu)}
.pill.ok{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px -3px var(--cy)}
.ctr{display:flex;align-items:center;gap:var(--s1)}
.ctr b{min-width:40px;text-align:center;font:700 26px "JetBrains Mono",monospace}
.cb{width:52px;height:52px;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--tx);font:700 24px Manrope,sans-serif;cursor:pointer;line-height:1}
.cb:active{transform:scale(.94)}
.cb.p{background:linear-gradient(135deg,#ff6b45,#e5392c);border:0;color:#fff;box-shadow:0 6px 16px rgba(229,57,44,.32)}
.wkrow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:var(--s1);align-items:center;min-height:48px;padding:var(--s1) 0;border-top:1px solid var(--ln)}
.wkrow span,.wkrow b{font:500 15px "JetBrains Mono",monospace}
.wkrow.h{border-top:0;min-height:0}.wkrow.h span{font-size:11px;color:var(--mu);letter-spacing:.08em}
.wkrow .g{color:var(--cy);font-weight:700}
.wkrow.t b{color:var(--rd)}.wkrow.f{opacity:.4}
.li b.m{font:700 22px "JetBrains Mono",monospace}
.stats span{line-height:1.4}
.sec>.li+.li,.sec>.wkrow+.wkrow,.sec>.wkrow.h+.wkrow{margin-top:0}
.sec>.wkrow.h{margin-top:var(--s2)}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<main>
 <div class="top"><div class="rec m"><i></i>MONTAGE</div><div class="row" style="gap:var(--s1);flex-wrap:nowrap"><div class="tc m" id="tc">00:00:00</div><button class="lnk" id="rf" aria-label="Обновить приложение">↻</button><button class="lnk" id="gear" data-a="cfg" aria-label="Настройки">⋯</button></div></div>
 <div id="banner"></div>
 <div id="view"></div>
</main>
<nav id="nav"></nav>
<dialog id="dlg" aria-labelledby="dt"><h2 id="dt"></h2><div id="df"></div><div id="derr" role="alert"></div><div class="acts"><button class="lnk" id="cX">Отмена</button><button class="btn p" id="cOk">Сохранить</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),KEY='cutlist_v1';
const ST=['ИДЕЯ','МОНТАЖ','ПРАВКИ','СДАН'],LS=['НАПИСАЛ','ОТВЕТИЛ','СОЗВОН','ЗАКАЗ','ОТКАЗ'];
const D={msg:{},done:{},projects:[],leads:[],income:[],ideas:[],sec:{},focus:{},timer:null,notified:0,
 goals:['Собрать 5 роликов в портфолио','Оформить Instagram / TikTok / Behance с работами','Выбрать нишу: Reels, YouTube, стримеры, бизнес','Написать 10 потенциальным заказчикам','Назначить цену за ролик','Первый платный заказ'].map(t=>({t,done:false})),
 set:{msgGoal:20,doneTypes:['Зум','Рилс экспортирован','Видео сдано'],sheets:{leads:'',mail:'',money:''},cur:'BYN (Br)',dream:'',dreamDate:'',why:'',clipGoal:3,goalMin:90,remind:'19:00',outGoal:5,monthGoal:30000,rate:500}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({},D,S||{});S.set=Object.assign({},D.set,S.set);if(!S.start)S.start=dk(new Date());
if(S.clips&&S.clips.length&&!S.projects.length)S.projects=S.clips.map((c,i)=>({id:'o'+i,t:c.t,k:c.k==='pay'?'Заказ':c.k,l:c.l||'',st:3,doneAt:c.d}));
if(S.money&&S.money.length&&!S.income.length)S.income=S.money.map(a=>({a,s:'',d:dk(new Date())}));
delete S.clips;delete S.money;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S._ts=Date.now();persist();schedulePush()};
function pad(n){return String(n).padStart(2,'0')}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const tod=()=>dk(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hm=s=>Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(Math.floor(s%60));
const runSec=()=>S.timer?Math.floor((Date.now()-S.timer)/1000):0;
const totSec=()=>Object.values(S.sec).reduce((a,b)=>a+b,0)+runSec();
const runToday=()=>S.timer?Math.floor((Date.now()-Math.max(S.timer,new Date().setHours(0,0,0,0)))/1000):0;
const todaySec=()=>(S.sec[tod()]||0)+runToday();
function addTime(a,b){while(a<b){const d=new Date(a),end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),e=Math.min(b,end),k=dk(d);S.sec[k]=(S.sec[k]||0)+Math.round((e-a)/1000);a=e}}
const ws=()=>{const x=new Date();x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const weekDays=()=>[...Array(7)].map((_,i)=>{const d=ws();d.setDate(d.getDate()+i);return dk(d)});
const cur=()=>{const c=S.set.cur||'BYN (Br)';const m=c.match(/\((.+)\)/);return m?m[1]:c};
const money=n=>n.toLocaleString('ru-RU')+' '+cur();
const fmtD=d=>d?d.slice(8)+'.'+d.slice(5,7):'';
let tab='today';
const TABS=[['today','СЕГОДНЯ'],['week','НЕДЕЛЯ'],['proj','ПРОЕКТЫ'],['idea','ПЛАН']];
const head=(l,b,a)=>`<div class="lab"><span>${l}</span><button class="btn s p" data-a="${a}">${b}</button></div>`;

 set(){const s=S.set;ask('Моя цель',[{k:'dream',l:'Цель одной фразой',v:s.dream,p:'Стать монтажёром, к которому стоит очередь'},{k:'dreamDate',l:'К какой дате',t:'date',v:s.dreamDate||plus(365)},{k:'why',l:'Ради чего я это делаю',v:s.why,p:'Свобода, семья, доказать себе…'}],o=>{Object.keys(o).forEach(k=>{if(o[k])S.set[k]=['dream','dreamDate','why'].includes(k)?o[k]:+o[k]})},{ok:'Сохранить — цель появится на главном экране',done:'Цель сохранена. Она теперь первая, что ты видишь.'})},
 nx(e){const a=S[e.l][e.i];if(e.l==='projects'){a.st=Math.min(3,a.st+1);if(a.st===3){a.doneAt=tod();toast('Проект сдан. Роликов в портфолио: '+S.projects.filter(p=>p.st===3).length+'.')}}else a.st=(a.st+1)%5},
 del(e){const x=S[e.l].splice(e.i,1)[0],l=e.l,i=e.i;toast('Удалено.',{act:'Вернуть',fn:()=>{S[l].splice(i,0,x);save();render()}})},
 tog(e){S[e.l][e.i].done=!S[e.l][e.i].done},
 addi(e){const i=$('[data-add="'+e.k+'"]');if(!i.value.trim()){toast('Сначала впиши текст в поле, потом нажми «Добавить».');i.focus();return 1}S[e.k].push({t:i.value.trim(),done:false});toast('Добавлено. Всего: '+S[e.k].length+'.')},
 thm(){const r=document.documentElement;const l=r.dataset.theme?r.dataset.theme==='light':matchMedia('(prefers-color-scheme:light)').matches;r.dataset.theme=l?'dark':'light';return 1},
 exp(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='cutlist-backup.json';a.click();S.lastBackup=tod();save();render();toast('Копия сохранена: cutlist-backup.json. Положи её в «Файлы» или iCloud.');return 1},
 imp(){$('#file').click();return 1}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-a]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0);return}
 const f=A[t.dataset.a];if(!f)return;const r=f({l:t.dataset.l,i:+t.dataset.i,k:t.dataset.k,n:+t.dataset.n});if(r===1||$('#dlg').open)return;save();render()});
document.addEventListener('change',e=>{if(e.target.id==='foc'){S.focus={d:tod(),t:e.target.value,done:S.focus.d===tod()&&S.focus.done};save()}});
document.addEventListener('input',e=>{if(e.target.id==='ch'||e.target.id==='cr')calc()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.add){S[e.target.dataset.add].push(e.target.value.trim()?{t:e.target.value.trim(),done:false}:null);S[e.target.dataset.add]=S[e.target.dataset.add].filter(Boolean);save();render()}});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;toast('Читаю файл…');const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n||typeof n!=='object'||!Array.isArray(n.projects||[]))throw 0;S=Object.assign({},D,n);S.set=Object.assign({},D.set,n.set||{});save();render();toast('Копия загружена: проектов '+S.projects.length+', доходов '+S.income.length+'.')}catch(x){toast('Не получилось прочитать файл. Выбери cutlist-backup.json, который ты скачивал кнопкой «Скачать копию данных».')}};r.onerror=()=>toast('Не удалось открыть файл. Попробуй ещё раз.');r.readAsText(f);e.target.value=''};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
pull();setInterval(()=>{if(!document.hidden)pull()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Вышла новая версия приложения.',{act:'Обновить',fn:()=>location.reload()})})}
$('#rf').onclick=async()=>{toast('Обновляю…');try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()};
let py=null;addEventListener('touchstart',e=>{py=(scrollY<=0&&!$('#dlg').open&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))?e.touches[0].clientY:null},{passive:true});
addEventListener('touchend',e=>{if(py!==null&&scrollY<=0&&e.changedTouches[0].clientY-py>120)$('#rf').click();py=null},{passive:true});
</script>
</body>
