<style>
:root{--s1:8px;--s2:24px;--s3:clamp(64px,12vw,96px);--bg:#0a0908;--sf:#17140f;--ln:rgba(255,255,255,.16);--tx:#f3ece1;--mu:#a29a8d;--rd:#ff6a5c;--cta:#e5392c;--cy:#ffb454;--gl:rgba(255,180,84,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4eee3;--sf:#fffaf0;--ln:rgba(0,0,0,.18);--tx:#1d1812;--mu:#5f5547;--rd:#c8321f;--cy:#9a5a0a;--gl:rgba(255,160,60,.22);color-scheme:light}}
:root[data-theme="light"]{--bg:#f4eee3;--sf:#fffaf0;--ln:rgba(0,0,0,.18);--tx:#1d1812;--mu:#5f5547;--rd:#c8321f;--cy:#9a5a0a;--gl:rgba(255,160,60,.22);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 480px at 50% -8%,var(--gl),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:17px/1.5 Manrope,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:640px;margin:0 auto;padding:var(--s2) var(--s2) 150px}
.m,.lab,.big,.btn,.chip,.mu2,#nav button{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.rec{display:flex;align-items:center;gap:var(--s1);font-weight:700;letter-spacing:.14em;font-size:13px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--rd);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
.tc{font-size:20px;color:var(--mu)}
.sec{margin-bottom:var(--s3)}.sec>*+*{margin-top:var(--s2)}
.cl{margin-bottom:var(--s2);flex-direction:column;align-items:flex-start;gap:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.lab{font-size:12px;letter-spacing:.14em;color:var(--mu);font-weight:500;text-transform:uppercase}
.dream{font:italic 800 clamp(26px,7vw,38px)/1.15 "Playfair Display",Georgia,serif;margin:0;cursor:pointer}
.why{font:italic 400 18px/1.5 "Playfair Display",Georgia,serif;color:var(--mu);margin:0;cursor:pointer}
.big{font-weight:700;font-size:clamp(52px,16vw,88px);line-height:1;letter-spacing:-.02em;text-shadow:0 0 36px var(--gl)}
.big.sm{font-size:clamp(36px,10vw,52px)}.big small{font-size:18px;color:var(--mu);font-weight:500}
.live .big{color:var(--rd)}.live .lab span:last-child{color:var(--rd)}
.mu2{font-size:13px;color:var(--mu);line-height:1.5;margin:0}
p{margin:0}
.bar{height:6px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy);width:0}
.btn{min-height:52px;padding:0 var(--s2);border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{border-color:var(--cy)}.btn:disabled{opacity:.6;cursor:wait}
.btn.p{background:var(--cta);border-color:var(--cta);color:#fff}
.go{width:100%;min-height:60px;font-size:15px;position:sticky;bottom:calc(56px + var(--s1) + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lnk{min-height:44px;padding:0;background:none;border:0;color:var(--mu);text-decoration:underline;text-underline-offset:4px;font:600 14px Manrope,sans-serif;cursor:pointer;text-align:left}
.lnk:hover{color:var(--cy)}
.links{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:var(--s2)}
.tight>*+*{margin-top:var(--s1)}
.card+.card{margin-top:var(--s2)}
.nm{font-size:18px}.nm a{color:inherit}
.chips{display:flex;gap:var(--s1);flex-wrap:wrap}
.chip{font-size:11px;letter-spacing:.06em;border:1px solid var(--ln);border-radius:20px;padding:2px var(--s1);color:var(--mu)}
.chip.r{border-color:var(--rd);color:var(--rd)}.chip.c{border-color:var(--cy);color:var(--cy)}
.li{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0;min-height:56px;border-top:1px solid var(--ln)}
.li .g{flex:1;min-width:0}.li.dn .g{text-decoration:line-through;color:var(--mu)}
.empty>*+*{margin-top:var(--s2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
.d{height:56px;border:1px solid var(--ln);border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:4px}
.d i{display:block;height:8px;background:var(--cy);border-radius:2px}
.d em{position:absolute;top:4px;left:4px;font:500 10px "JetBrains Mono",monospace;color:var(--mu);font-style:normal}
.d.t{border-color:var(--rd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.stats b{display:block;font:700 28px "JetBrains Mono",monospace}.stats span{font-size:13px;color:var(--mu)}
.hist{display:flex;gap:var(--s1);align-items:flex-end;height:40px}.hist div{flex:1;background:var(--ln);border-radius:3px;position:relative;height:100%}.hist i{position:absolute;left:0;right:0;bottom:0;background:var(--cy);border-radius:3px}
.quote{border-left:2px solid var(--cy);padding-left:var(--s2);font:italic 400 20px/1.5 "Playfair Display",Georgia,serif}
.lvl{color:var(--cy);font-weight:600;font-size:15px}
.chk,.add{display:flex;gap:var(--s2);align-items:center}.add input{flex:1}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
label{display:block;margin-bottom:var(--s1);font-size:14px;color:var(--mu)}
input,select{font:inherit;font-size:17px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:0 var(--s1);min-height:52px;width:100%}
select option{background:var(--sf);color:var(--tx)}
input[type=checkbox]{width:26px;min-height:26px;height:26px;accent-color:var(--cy);flex:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#banner{display:none;border-left:3px solid var(--rd);padding-left:var(--s2);margin-bottom:var(--s2);color:var(--rd);font-weight:600}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;max-width:144px;margin:0 auto;min-height:56px;background:none;border:0;color:var(--mu);font-weight:700;font-size:11px;letter-spacing:.08em;cursor:pointer;box-shadow:inset 0 2px 0 transparent}
#nav button.on{color:var(--rd);box-shadow:inset 0 2px 0 var(--rd)}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:20px;width:min(92vw,440px);padding:var(--s2);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 var(--s1);font-size:22px}
dialog label{margin-top:var(--s2)}
#derr{color:var(--rd);font-size:14px;min-height:24px;margin-top:var(--s2)}
.acts{display:flex;flex-direction:column-reverse;align-items:stretch;gap:var(--s1);margin-top:var(--s1)}.acts .lnk{text-align:center;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s2) + 72px + env(safe-area-inset-bottom,0px));background:var(--sf);border:1px solid var(--cy);border-radius:12px;padding:var(--s1) var(--s2);z-index:20;display:none;align-items:center;gap:var(--s2);width:min(92vw,560px);font-size:15px}
#toast.on{display:flex}#toast button{background:none;border:0;color:var(--cy);font:700 14px Manrope,sans-serif;min-height:44px;cursor:pointer;text-decoration:underline}
@media(max-width:380px){.calc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
 <div class="top"><div class="rec m"><i></i>REC · CUT LIST</div><div class="tc m" id="tc">00:00:00</div></div>
 <div id="banner"></div>
 <div id="view"></div>
</main>
<nav id="nav"></nav>
<dialog id="dlg" aria-labelledby="dt"><h2 id="dt"></h2><div id="df"></div><div id="derr" role="alert"></div><div class="acts"><button class="lnk" id="cX">Отмена</button><button class="btn p" id="cOk">Сохранить</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),KEY='cutlist_v1';
const ST=['ИДЕЯ','МОНТАЖ','ПРАВКИ','СДАН'],LS=['НАПИСАЛ','ОТВЕТИЛ','СОЗВОН','ЗАКАЗ','ОТКАЗ'];
const D={projects:[],leads:[],income:[],ideas:[],sec:{},focus:{},timer:null,notified:0,
 goals:['Собрать 5 роликов в портфолио','Оформить Instagram / TikTok / Behance с работами','Выбрать нишу: Reels, YouTube, стримеры, бизнес','Написать 10 потенциальным заказчикам','Назначить цену за ролик','Первый платный заказ'].map(t=>({t,done:false})),
 set:{cur:'BYN (Br)',dream:'',dreamDate:'',why:'',clipGoal:3,goalMin:90,remind:'19:00',outGoal:5,monthGoal:30000,rate:500}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({},D,S||{});S.set=Object.assign({},D.set,S.set);if(!S.start)S.start=dk(new Date());
if(S.clips&&S.clips.length&&!S.projects.length)S.projects=S.clips.map((c,i)=>({id:'o'+i,t:c.t,k:c.k==='pay'?'Заказ':c.k,l:c.l||'',st:3,doneAt:c.d}));
if(S.money&&S.money.length&&!S.income.length)S.income=S.money.map(a=>({a,s:'',d:dk(new Date())}));
delete S.clips;delete S.money;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S._ts=Date.now();persist();schedulePush()};
function pad(n){return String(n).padStart(2,'0')}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const tod=()=>dk(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hm=s=>Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(Math.floor(s%60));
const runSec=()=>S.timer?Math.floor((Date.now()-S.timer)/1000):0;
const totSec=()=>Object.values(S.sec).reduce((a,b)=>a+b,0)+runSec();
const runToday=()=>S.timer?Math.floor((Date.now()-Math.max(S.timer,new Date().setHours(0,0,0,0)))/1000):0;
const todaySec=()=>(S.sec[tod()]||0)+runToday();
function addTime(a,b){while(a<b){const d=new Date(a),end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),e=Math.min(b,end),k=dk(d);S.sec[k]=(S.sec[k]||0)+Math.round((e-a)/1000);a=e}}
const ws=()=>{const x=new Date();x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const weekDays=()=>[...Array(7)].map((_,i)=>{const d=ws();d.setDate(d.getDate()+i);return dk(d)});
const cur=()=>{const c=S.set.cur||'BYN (Br)';const m=c.match(/\((.+)\)/);return m?m[1]:c};
const money=n=>n.toLocaleString('ru-RU')+' '+cur();
const fmtD=d=>d?d.slice(8)+'.'+d.slice(5,7):'';
let tab='today';
const TABS=[['today','СЕГОДНЯ'],['proj','ПРОЕКТЫ'],['lead','ЛИДЫ'],['money','ДЕНЬГИ'],['idea','ИДЕИ']];
const head=(l,b,a)=>`<div class="lab"><span>${l}</span><button class="btn s p" data-a="${a}">${b}</button></div>`;
function streak(){let n=0,d=new Date();if((S.sec[dk(d)]||0)<600)d.setDate(d.getDate()-1);while((S.sec[dk(d)]||0)>=600){n++;d.setDate(d.getDate()-1)}return n}

const LV=[[0,'Первый кадр'],[5,'Руки привыкают'],[25,'Появляется ритм'],[100,'Своя рука'],[300,'Профессиональный взгляд'],[1000,'Мастер']];
const QP=[["МЫСЛЬ", "Тебе 19. Каждый час сейчас работает на тебя через пять лет."], ["МЫСЛЬ", "Талант не обязателен. Обязательно количество законченных роликов."], ["МЫСЛЬ", "Первый ролик будет плохим. Второй уже лучше. Третий уже можно показывать."], ["МЫСЛЬ", "Никто не придёт и не скажет «пора». Это решаешь ты."], ["МЫСЛЬ", "Один законченный ролик лучше десяти идеальных планов."], ["МЫСЛЬ", "Не нужно вдохновение. Просто включи таймер."], ["МЫСЛЬ", "Сегодняшний ты решает, кем будешь в 25."], ["МЫСЛЬ", "Страшно показывать работу? Покажи. После первого раза станет легче."], ["МЫСЛЬ", "Мастера тоже начинали с плохого монтажа."], ["МЫСЛЬ", "Пока ты сравниваешь себя с лучшими, они монтируют. Монтируй и ты."], ["МЫСЛЬ", "Усталость не причина не начинать. Начни на 10 минут и посмотри, что будет."], ["МЫСЛЬ", "Каждый ролик в портфолио говорит за тебя, даже когда тебя нет рядом."], ["ПРИЁМ МОНТАЖА", "Режь на движении: склейка в момент действия почти незаметна."], ["ПРИЁМ МОНТАЖА", "Звук составляет половину картинки. Плохой звук убивает хороший кадр."], ["ПРИЁМ МОНТАЖА", "Первые три секунды решают, досмотрят ли ролик."], ["ПРИЁМ МОНТАЖА", "Сомневаешься, нужен ли кадр? Убери его."], ["ПРИЁМ МОНТАЖА", "Отложи ролик на час, потом посмотри свежим глазом: лишнее видно сразу."], ["ПРИЁМ МОНТАЖА", "Посмотри ролик один раз без звука и один раз только на слух. Ошибки вылезут."], ["ПРИЁМ МОНТАЖА", "Склеивай по ритму музыки, а не по секундам на таймлайне."], ["ПРИЁМ МОНТАЖА", "J- и L-склейки: пусть звук следующего кадра начинается раньше картинки. Монтаж станет мягче."], ["ПРИЁМ МОНТАЖА", "Сначала ритм и смысл, потом цветокоррекция и эффекты."], ["ПРИЁМ МОНТАЖА", "Каждый эффект должен отвечать на вопрос «зачем». Нет ответа, убирай."], ["ПРИЁМ МОНТАЖА", "Учи горячие клавиши: секунда экономии умножается на тысячи склеек."], ["ПРИЁМ МОНТАЖА", "Называй дорожки и слои. Через месяц скажешь себе спасибо."], ["ПРИЁМ МОНТАЖА", "Сохраняй версии проекта: ролик_v1, ролик_v2. Откат спасает нервы."], ["ПРИЁМ МОНТАЖА", "Субтитры должны читаться без пауз: проверь скорость чтения."], ["ПРО ЗАКАЗЫ", "Перед работой спроси референс: один пример экономит три круга правок."], ["ПРО ЗАКАЗЫ", "Назови заказчику число правок заранее. Бесконечных правок не бывает."], ["ПРО ЗАКАЗЫ", "Покажи «до и после»: этот формат продаёт монтаж лучше слов."], ["ПРО ЗАКАЗЫ", "Не пропадай: напиши заказчику статус, даже если всё идёт по плану."], ["ПРО ЗАКАЗЫ", "Не занижай цену до нуля: бесплатную работу ценят меньше."], ["ПРО ЗАКАЗЫ", "Предоплата защищает и тебя, и заказчика."], ["ПРО ЗАКАЗЫ", "Лучший способ найти заказчика: сделать ролик для того, кто ещё не просил."], ["ПРО ЗАКАЗЫ", "Один отзыв довольного заказчика стоит больше десяти постов о себе."], ["ПРО ЗАКАЗЫ", "Ответь сегодня на одно сообщение, которое откладывал. Заказы прячутся там."], ["ДИСЦИПЛИНА", "Запиши время монтажа в календарь. Что записано, то и происходит."], ["ДИСЦИПЛИНА", "Выключи уведомления на время монтажа. Лента подождёт."], ["ДИСЦИПЛИНА", "Лучше 30 минут каждый день, чем 5 часов раз в месяц."], ["ДИСЦИПЛИНА", "Начни с самого простого кадра: инерция потянет дальше."], ["ДИСЦИПЛИНА", "В конце дня подведи итог: что сдал, что осталось. Завтра стартуешь легче."]];
let qo=0;
function qBox(){const st=streak(),s=todaySec(),g=S.set.goalMin*60,h=new Date().getHours(),C=[];
 if(S.timer)C.push(['ТВОЙ ПУТЬ','Идёт запись. Каждая минута сейчас остаётся с тобой.']);
 else if(s>=g)C.push(['ТВОЙ ПУТЬ','Цель дня выполнена. Всё, что сверху, уже бонус.']);
 else if(s>=600)C.push(['ТВОЙ ПУТЬ','Ты уже начал: '+hm(s)+'. До цели дня осталось '+hm(g-s)+'.']);
 else if(st>0&&h>=17)C.push(['ТВОЙ ПУТЬ','Серия '+st+' дн. Не ломай её: хватит и 10 минут.']);
 if(!S.projects.some(p=>p.st===3))C.push(['ТВОЙ ПУТЬ','Портфолио пока пустое. Первый сданный ролик это изменит.']);
 if(!S.leads.length)C.push(['ПРО ЗАКАЗЫ','Контактов нет. Добавь одного человека, которому хочешь показать работу.']);
 const d=Math.floor(new Date().setHours(0,0,0,0)/864e5)%QP.length,all=C.concat(QP.slice(d),QP.slice(0,d)),q=all[qo%all.length];
 return `<div class="lab">${q[0]}</div><blockquote class="quote" data-a="qn" style="margin:0;cursor:pointer">${esc(q[1])}</blockquote><p class="mu2">Нажми на фразу, чтобы увидеть другую</p>`}
function hot(){const L=[];S.leads.filter(l=>l.st<3&&l.fu&&l.fu<=tod()).forEach(l=>L.push(['Написать: '+l.n,'lead']));
 S.projects.filter(p=>p.st<3&&p.dl&&p.dl<=plus(2)).forEach(p=>L.push([(p.dl<tod()?'Просрочен: ':'Дедлайн '+fmtD(p.dl)+': ')+p.t,'proj']));
 return L.length?`<section class="sec"><div class="lab">ГОРИТ · ${L.length}</div>${L.slice(0,4).map(x=>`<div class="li"><div class="g">${esc(x[0])}</div><button class="lnk" data-t="${x[1]}">Открыть</button></div>`).join('')}</section>`:''}

const PRESETS=['BYN (Br)','RUB (₽)','USD ($)','EUR (€)','UAH (₴)','KZT (₸)','PLN (zł)'];
const A={
 qn(){qo++;render();return 1},

 mgoal(){const s=S.set;ask('Доход и валюта',[{k:'cur',l:'Валюта',o:PRESETS,v:s.cur},{k:'monthGoal',l:'Цель дохода в месяц',t:'number',v:s.monthGoal},{k:'rate',l:'Ставка за час монтажа',t:'number',v:s.rate}],o=>{s.cur=o.cur;if(+o.monthGoal>0)s.monthGoal=+o.monthGoal;if(+o.rate>0)s.rate=+o.rate},{ok:'Сохранить — суммы пересчитаются',done:()=>'Цель месяца: '+money(S.set.monthGoal)+'.'})},
 tedit(){ask('Время за сегодня',[{k:'t',l:'Всего за сегодня (ч:мм:сс), например 1:30:00',v:hm(todaySec()),p:'1:30:00'}],o=>{const m=o.t.split(':').map(Number);if(!o.t||m.length>3||m.some(x=>isNaN(x)||x<0)){ferr('Формат: часы:минуты:секунды, например 1:30:00.');return false}
  const sec=m.length===3?m[0]*3600+m[1]*60+m[2]:m.length===2?m[0]*3600+m[1]*60:m[0]*60;S.sec[tod()]=Math.max(0,sec-runToday())},{ok:'Сохранить время — таймер покажет его сразу',done:()=>'Время за сегодня: '+hm(todaySec())+'.'})},
 login(){ask('Вход в облако',[{k:'e',l:'Почта',t:'email',ac:'email'},{k:'p',l:'Пароль (минимум 6 символов)',t:'password',ac:'current-password'},{k:'m',l:'Действие',o:['Войти','Создать аккаунт']}],o=>{if(!o.e||o.p.length<6){ferr('Введи почту и пароль от 6 символов.');return false}return auth(o)},{ok:'Продолжить — данные появятся на всех устройствах',load:'Входим…'})},
 logout(){CL.u=null;try{localStorage.removeItem('cl_auth')}catch(e){}render();toast('Ты вышел. Данные остались на этом устройстве и в облаке.');return 1},
 resync(){toast('Проверяю облако…');pull().then(()=>toast(/синхрон|обновл/.test(CL.st)?'Всё синхронизировано.':'Статус: '+CL.st));return 1},
 fd(){S.focus={d:tod(),t:S.focus.d===tod()?S.focus.t:'',done:!(S.focus.d===tod()&&S.focus.done)}},
 timer(){qo=0;if(S.timer){const s=runSec();addTime(S.timer,Date.now());S.timer=null;toast('Сохранено '+hm(s)+'. Сегодня всего '+hm(todaySec())+' из '+hm(S.set.goalMin*60)+'.'+(s>14400?' Таймер шёл больше 4 часов. Если забыл остановить, нажми «Поправить время».':''))}else{S.timer=Date.now();toast('Таймер запущен. Нажми «Остановить», когда закончишь: время запишется.')}},
 addp(){ask('Новый проект',[{k:'t',l:'Название'},{k:'k',l:'Тип',o:['Практика','Заказ','Для себя','Разбор референса']},{k:'dl',l:'Дедлайн (необязательно)',t:'date'},{k:'l',l:'Ссылка (необязательно)',p:'https://'}],o=>{if(!o.t){ferr('Впиши название проекта.');return false}S.projects.push({id:Date.now(),t:o.t,k:o.k,dl:o.dl,l:o.l,st:0})},{ok:'Добавить проект — попадёт в «В работе»',done:()=>'Проект добавлен. В работе теперь: '+S.projects.filter(p=>p.st<3).length+'. Дальше жми «Перевести в МОНТАЖ».'})},
 addl(){ask('Новый контакт',[{k:'n',l:'Имя или канал'},{k:'c',l:'Где писать (Instagram, Telegram…)'},{k:'fu',l:'Написать',t:'date',v:plus(1)}],o=>{if(!o.n){ferr('Впиши имя или название канала.');return false}S.leads.push({n:o.n,c:o.c,st:0,fu:o.fu,added:tod()})},{ok:'Добавить контакт — напомню написать в срок',done:o=>'Контакт добавлен. Напиши ему '+fmtD(o.fu)+'.'})},
 addm(){ask('Доход',[{k:'a',l:'Сумма, '+cur(),t:'number'},{k:'s',l:'От кого / за что'}],o=>{if(!+o.a){ferr('Впиши сумму больше нуля.');return false}S.income.push({a:+o.a,s:o.s,d:tod()})},{ok:'Записать доход — пойдёт в цель месяца',done:o=>{const m=tod().slice(0,7);return 'Записано '+money(+o.a)+'. За месяц уже '+money(S.income.filter(x=>x.d.startsWith(m)).reduce((s,x)=>s+x.a,0))+'.'}})},
 set(){const s=S.set;ask('Моя цель',[{k:'dream',l:'Цель одной фразой',v:s.dream,p:'Стать монтажёром, к которому стоит очередь'},{k:'dreamDate',l:'К какой дате',t:'date',v:s.dreamDate||plus(365)},{k:'why',l:'Ради чего я это делаю',v:s.why,p:'Свобода, семья, доказать себе…'},{k:'clipGoal',l:'Роликов в неделю',t:'number',v:s.clipGoal},{k:'outGoal',l:'Новых контактов в неделю',t:'number',v:s.outGoal}],o=>{Object.keys(o).forEach(k=>{if(o[k])S.set[k]=['dream','dreamDate','why'].includes(k)?o[k]:+o[k]})},{ok:'Сохранить — цель появится на главном экране',done:'Цель сохранена. Она теперь первая, что ты видишь.'})},
 nx(e){const a=S[e.l][e.i];if(e.l==='projects'){a.st=Math.min(3,a.st+1);if(a.st===3){a.doneAt=tod();toast('Проект сдан. Роликов в портфолио: '+S.projects.filter(p=>p.st===3).length+'.')}}else a.st=(a.st+1)%5},
 fu(e){S.leads[e.i].fu=plus(3);toast('Напомню написать '+fmtD(S.leads[e.i].fu)+'.')},
 del(e){const x=S[e.l].splice(e.i,1)[0],l=e.l,i=e.i;toast('Удалено.',{act:'Вернуть',fn:()=>{S[l].splice(i,0,x);save();render()}})},
 tog(e){S[e.l][e.i].done=!S[e.l][e.i].done},
 addi(e){const i=$('[data-add="'+e.k+'"]');if(!i.value.trim()){toast('Сначала впиши текст в поле, потом нажми «Добавить».');i.focus();return 1}S[e.k].push({t:i.value.trim(),done:false});toast('Добавлено. Всего: '+S[e.k].length+'.')},
 thm(){const r=document.documentElement;const l=r.dataset.theme?r.dataset.theme==='light':matchMedia('(prefers-color-scheme:light)').matches;r.dataset.theme=l?'dark':'light';return 1},
 notif(){if(typeof Notification==='undefined'||Notification.permission==='denied'){toast(typeof Notification==='undefined'?'На iPhone: «Поделиться» → «На экран Домой», открой с иконки и нажми «Разрешить».':'Открой настройки сайта в браузере, разреши уведомления и вернись сюда.');return 1}
  Notification.requestPermission().then(p=>{toast(p==='granted'?'Уведомления включены. Напомню в '+S.set.remind+'.':'Не разрешено. Останутся красная плашка и звук, пока приложение открыто.');render()});return 1},
 exp(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='cutlist-backup.json';a.click();S.lastBackup=tod();save();render();toast('Копия сохранена: cutlist-backup.json. Положи её в «Файлы» или iCloud.');return 1},

document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-a]');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0);return}
 const f=A[t.dataset.a];if(!f)return;const r=f({l:t.dataset.l,i:+t.dataset.i,k:t.dataset.k});if(r===1||$('#dlg').open)return;save();render()});
